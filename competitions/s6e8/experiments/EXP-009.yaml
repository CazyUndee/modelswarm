experiment_id: EXP-009
competition: s6e8
status: queued
hypothesis: 'Seed diversity alone reduces prediction variance: probability-averaging
  five LightGBM runs of the champion-style configuration (seeds 42/123/7/2024/99)
  will match or slightly beat the best single seed and quantify champion seed-sensitivity
  for all future delta judgments.'
phase: 4
model:
  name: ensemble
  blend: probability_average
  members:
