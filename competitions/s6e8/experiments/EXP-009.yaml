    parameters:
      n_estimators: 1000
      learning_rate: 0.05
      num_leaves: 64
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 0.1
      n_jobs: -1
      verbose: -1
