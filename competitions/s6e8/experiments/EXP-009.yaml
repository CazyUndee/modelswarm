# Experiment Configuration — executed by GitHub Actions (experiment-runner.yml).
# Push a change to this file → Actions trains on the committed data and writes
# results back under `results`. DO NOT run this locally.
#
# Design: five LightGBM members with IDENTICAL champion-style hyperparameters,
# differing only in random_state. Probability-averaging them isolates pure
# seed variance: the member spread IS the seed-sensitivity measurement, and the
# blend shows how much of it averaging recovers. Uses raw canonical features
# (EXP-007 finding: derived ratios add nothing).

experiment_id: EXP-009
competition: s6e8
status: queued

hypothesis: >-
  Seed diversity alone reduces prediction variance: probability-averaging five
  LightGBM runs of the champion-style configuration (seeds 42/123/7/2024/99)
  will match or slightly beat the best single seed and quantify champion
  seed-sensitivity for all future delta judgments.
phase: 4

model:
  name: ensemble
  blend: probability_average
  members:
    - name: lightgbm
      parameters: &lgbm_params
        n_estimators: 1000
        learning_rate: 0.05
        num_leaves: 64
        min_child_samples: 20
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 0.1
        n_jobs: -1
        verbose: -1
        random_state: 42
        early_stopping_rounds: 50
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 123
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 7
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 2024
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 99

features:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact

validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42

training:
  compute: github_actions
  timeout_minutes: 90
  predict_test: true

metadata:
  author: agent-orchestrator
  parent_experiment: EXP-006
  created_at: "2026-08-24T16:10:00Z"
  design_notes: >-
    Member OOF AUCs across seeds = champion seed-sensitivity estimate.
    Member OOF correlations = upper bound on what any same-family averaging
    can achieve; compare against EXP-008 cross-family correlations.

# Results (filled automatically by scripts/record_results.py after the run)
