feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: pair_grid
  columns:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - weekend_screen_time
  resolution: 10
  max_pairs: 20
hypothesis: 'CLEAN pair-lattice per the validated latr1_xgb recipe: pairs restricted
  to the six 0.01-grid screen/sleep columns at 0.1 resolution (coarser cells + freq
  counts to discount noise), NO continuous-derived features in the grid, NO nested
  TE. On EXP-122 base (10-fold, plain TE m=10). EXP-126 collapse root-caused: pairs
  over continuous derived features created near-unique levels -> self-referential
  plain-TE -> collapse; latwide recipe avoids this by construction.'
