feature_engineering:
- name: free_time_slack
  op: diff
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: pair_grid
hypothesis: 'Pair-lattice target encoding (Deotte winning mechanism; validated on
  THIS comp by library latwide_* engines - latr1_xgb 0.96780 strongest single GBM):
  all numeric values sit on a 0.01 grid so each PAIR of columns gets a joint integer
  level code, then nested-TE encoded like single columns. Single variable vs EXP-123:
  + FE op pair_grid (36 numeric pairs, sentinel bucket for NaN) and TE columns glob
  pair_* included.'
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-123
  created_at: '2026-08-25T21:35:00Z'
  design_notes: Runner gains target_encoding.nested/inner_folds/frequency knobs +
    _nested_target_encode_train (StratifiedKFold inner splits, seed 42) + freq maps
    in stats. Unit-tested for own-label exclusion on lonely levels (test_nested_te.py).
    Budget-bound imputation (missing components bounded by daily-others) deliberately
    NOT included here - one variable at a time; queued as follow-up if nested confirms.
