feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: digit_split
  columns:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
hypothesis: 'donmarch14 quantisation family standalone: d1_<col> first-decimal-digit
  + frac_<col> fractional-part columns for the eight numeric behaviour cols. raphdraft
  measured digit-1 swings positive rate 0.65->0.74 (z=-31.7); our TE already encodes
  exact-value rates, but explicit digit columns give trees direct coarse-level splits
  that may generalize where exact-value TE is thin.'
