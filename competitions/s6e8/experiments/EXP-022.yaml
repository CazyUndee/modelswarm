# Experiment Configuration — executed by GitHub Actions (experiment-runner.yml).
# Push a change to this file → Actions trains on the committed data and writes
# results back under `results`. DO NOT run this locally.
#
# Histogram precision probe: max_bin 255 -> 511 at the exact champion config
# (EXP-013). Finer binning sharpens split points on continuous features.
# Single-variable A/B; cheap relative to remaining ideas.

experiment_id: EXP-022
competition: s6e8
status: queued

hypothesis: >-
  Doubling histogram resolution (max_bin 511) refines split points enough to
  edge the champion (EXP-013, 0.964109) upward at nl255 capacity.
phase: 4

model:
  name: ensemble
  blend: probability_average
  members:
    - name: lightgbm
      parameters: &lgbm_params
        n_estimators: 3000
        learning_rate: 0.02
        num_leaves: 255
        min_child_samples: 80
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.7
        reg_alpha: 0.1
        reg_lambda: 0.1
        max_bin: 511
        n_jobs: -1
        verbose: -1
        random_state: 42
        early_stopping_rounds: 150
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 123
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 7
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 2024
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 99

features:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact

validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42

training:
  compute: github_actions
  timeout_minutes: 120
  predict_test: true

metadata:
  author: agent-orchestrator
  parent_experiment: EXP-013
  created_at: "2026-08-24T20:40:00Z"
  design_notes: Last cheap single-variable lever; everything else measured flat or negative.

# Results (filled automatically by scripts/record_results.py after the run)
