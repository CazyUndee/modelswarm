  n_folds: 5
  random_state: 42
training:
  compute: github_actions
  timeout_minutes: 120
  predict_test: true
  pseudo_label:
    low: 0.01
    high: 0.99
    weight: 0.3
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-013
  created_at: '2026-08-24T20:45:00Z'
  design_notes: "3 seeds to keep double-fit cost sane (~2x EXP-013). Integrity note:\
    \ base models see fold-train only, so OOF remains leak-free w.r.t. validation\
    \ rows; mild optimism vs true LB possible if pseudo labels are wrong \u2014 weight\
    \ kept conservative (0.3). If OOF improves but LB would not, the gap shows in\
    \ public score after submission."
