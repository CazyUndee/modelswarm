experiment_id: EXP-023
competition: s6e8
status: queued
hypothesis: Self-training on confident test predictions (p<=0.01 or p>=0.99, weight
  0.3) adds real signal from the 296k-row unlabeled test set and beats champion EXP-013
  (0.964109), because the decision boundary region is small relative to the confidently-classified
  mass.
phase: 4
model:
  name: ensemble
  blend: probability_average
  members:
  - name: lightgbm
    parameters:
      n_estimators: 3000
      learning_rate: 0.02
      num_leaves: 255
      min_child_samples: 80
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_alpha: 0.1
      reg_lambda: 0.1
      n_jobs: -1
      verbose: -1
      random_state: 42
      early_stopping_rounds: 150
  - name: lightgbm
    parameters:
      n_estimators: 3000
      learning_rate: 0.02
      num_leaves: 255
      min_child_samples: 80
      subsample: 0.8
