competition: s6e8
experiment_id: EXP-126
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
- free_time_slack
feature_engineering:
- op: budget_constraint
  daily: daily_screen_time_hours
  components:
  - social_media_hours
  - gaming_hours
  - work_study_hours
  day_hours: 24.0
- op: impute_median
  columns:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: ratio
  name: productive_ratio
  numerator: work_study_hours
  denominator: daily_screen_time_hours
- op: sum
  name: leisure_hours
  terms:
  - social_media_hours
  - gaming_hours
- op: ratio
  name: leisure_ratio
  numerator: leisure_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: sleep_screen_ratio
  numerator: sleep_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: weekend_binge_ratio
  numerator: weekend_screen_time
  denominator: daily_screen_time_hours
- op: ratio
  name: notif_per_open
  numerator: notifications_per_day
  denominator: app_opens_per_day
- op: sum
  name: accounted_hours
  terms:
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
- op: pair_grid
hypothesis: 'Max-strength combination: pair-lattice TE + raphdraft budget/ratio block
  on PLAIN fold-train TE (nested rejected: -0.00062 in EXP-123) at 10 FOLDS (EXP-122:
  +0.0003). Externally validated mechanisms, internally handicapped until now by the
  nested knob.'
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-122
  created_at: '2026-08-25T21:35:00Z'
  design_notes: Runner gains target_encoding.nested/inner_folds/frequency knobs +
    _nested_target_encode_train (StratifiedKFold inner splits, seed 42) + freq maps
    in stats. Unit-tested for own-label exclusion on lonely levels (test_nested_te.py).
    Budget-bound imputation (missing components bounded by daily-others) deliberately
    NOT included here - one variable at a time; queued as follow-up if nested confirms.
