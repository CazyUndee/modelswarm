hypothesis: Last-resort TabM with tight 300s budget. Prior attempt (EXP-127) failed
  at 420s/fold x 5 folds = too slow on GHA CPU. Community TabM singles: OOF 0.9685-0.9687.
  With 300s budget and early stopping, each fold should complete in ~6-8 min. Two
  members (seeds 42/123) for seed averaging. If TabM decorrelates from GBDT (rank
  corr <0.99), it adds genuine diversity for frontier attack.
metadata:
