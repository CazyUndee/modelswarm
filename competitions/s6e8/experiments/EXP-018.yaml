# Experiment Configuration — executed by GitHub Actions (experiment-runner.yml).
# Push a change to this file → Actions trains on the committed data and writes
# results back under `results`. DO NOT run this locally.
#
# GOSS boosting probe: gradient-based one-side sampling (last untested boosting
# scheme). Uses the smaller-data-aware sampling; historically competitive with
# standard GBDT at a fraction of cost. Same capacity family as champion.

experiment_id: EXP-018
competition: s6e8
status: queued

hypothesis: >-
  LightGBM GOSS boosting (top_rate 0.2, other_rate 0.1) at nl255 champion
  capacity, averaged over 5 seeds, matches or beats GBDT-mode EXP-013
  (0.964109) while training several times faster.
phase: 4

model:
  name: ensemble
  blend: probability_average
  members:
    - name: lightgbm
      parameters: &lgbm_params
        boosting_type: goss
        n_estimators: 3000
        learning_rate: 0.02
        num_leaves: 255
        min_child_samples: 80
        subsample_freq: 1   # GOSS forbids bagging; freq>0 with subsample disabled is safe no-op
        colsample_bytree: 0.7
        reg_alpha: 0.1
        reg_lambda: 0.1
        top_rate: 0.2
        other_rate: 0.1
        n_jobs: -1
        verbose: -1
        random_state: 42
        early_stopping_rounds: 150
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 123
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 7
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 2024
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 99

features:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact

validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42

training:
  compute: github_actions
  timeout_minutes: 120
  predict_test: true

metadata:
  author: agent-orchestrator
  parent_experiment: EXP-013
  created_at: "2026-08-24T19:00:00Z"
  design_notes: >-
    Note: subsample left unset (GOSS incompatible with bagging). If GOSS lands
    within ~0.0003 of champion at much lower runtime, it becomes the preferred
    base for wide hyperparameter sweeps (cheaper iterations).

# Results (filled automatically by scripts/record_results.py after the run)
