competition: s6e8
experiment_id: EXP-135
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
- free_time_slack
feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
hypothesis: Logistic regression + LightGBM ensemble for linear diversity. Logistic
  regression makes genuinely different errors from tree splits (linear decision boundary
  vs axis-aligned splits). If decorrelated (rank corr <0.995), the blend could exceed
  single-family champion. Logistic uses median-imputed numerics + one-hot categoricals
  + standardization. LightGBM is the champion config from EXP-119.
metadata:
  author: agent-81d2
  parent_experiment: EXP-119
  created_at: '2026-08-31T21:00:00Z'
  design_notes: 'Linear diversity shot: logistic regression is genuinely decorrelated
    from tree splits. If it adds even small unique signal, the blend could improve.
    Quick to train (~2 min total).'
model:
  name: ensemble
  blend: probability_average
  members:
  - name: lightgbm
    parameters:
      colsample_bytree: 0.3
      early_stopping_rounds: 150
      learning_rate: 0.02
      max_bin: 2048
      min_child_samples: 80
      n_estimators: 3000
      n_jobs: -1
      num_leaves: 255
      random_state: 42
      reg_alpha: 0.1
      reg_lambda: 0.1
      subsample: 0.8
      subsample_freq: 1
      verbose: -1
  - name: logistic
    parameters:
      C: 1.0
      max_iter: 1000
      random_state: 42
phase: 4
status: queued
training:
  compute: github_actions
  predict_test: true
  timeout_minutes: 60
validation:
  n_folds: 5
  random_state: 42
  strategy: stratified_kfold
target_encoding:
  columns:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact
  smoothing: 50
