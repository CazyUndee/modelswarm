experiment_id: EXP-008
competition: s6e8
status: queued
hypothesis: Probability averaging of LightGBM + XGBoost + CatBoost OOF predictions
  on the canonical 12-feature raw set will beat champion EXP-006 (OOF 0.96421) because
  family-level error decorrelation adds ensemble signal that no single GBDT captures.
phase: 4
model:
  name: ensemble
  blend: probability_average
  members:
  - name: lightgbm
    parameters:
      n_estimators: 1000
      learning_rate: 0.05
      num_leaves: 64
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 0.1
      n_jobs: -1
      verbose: -1
      random_state: 42
      early_stopping_rounds: 50
  - name: xgboost
    parameters:
      n_estimators: 1000
      learning_rate: 0.05
      max_depth: 6
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      n_jobs: -1
      random_state: 42
      early_stopping_rounds: 50
  - name: catboost
    parameters:
      iterations: 1000
      learning_rate: 0.05
      depth: 6
      l2_leaf_reg: 3.0
      random_seed: 42
      n_jobs: -1
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42
training:
  compute: github_actions
  timeout_minutes: 90
  predict_test: true
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-006
  created_at: '2026-08-24T16:00:00Z'
  design_notes: Canonical raw features only (EXP-007 finding). Champion-style LGBM
    member mirrors EXP-006 hyperparameters. rank_average reported as diagnostic; probability_average
    declared primary BEFORE results to avoid selection bias.
