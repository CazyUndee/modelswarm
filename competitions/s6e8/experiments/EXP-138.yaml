hypothesis: "CatBoost with symmetric oblivious trees \u2014 structurally different\
  \ from LGBM leaf-wise and XGBoost depth-wise splits. CatBoost handles categoricals\
  \ natively and uses ordered boosting for less overfitting. With TE m=50 on all numerics\
  \ and early stopping, this should produce genuinely different error patterns from\
  \ the champion LGBM. depth=8, l2_leaf_reg=3, learning_rate 0.03, 3000 iterations."
