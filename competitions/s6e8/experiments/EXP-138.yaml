hypothesis: 'CatBoost with symmetric oblivious trees — structurally different from
  LGBM leaf-wise and XGBoost depth-wise splits. CatBoost handles categoricals natively
  and uses ordered boosting for less overfitting. With TE m=50 on all numerics and
  early stopping, this should produce genuinely different error patterns from the
  champion LGBM. depth=8, l2_leaf_reg=3, learning_rate 0.03, 3000 iterations.'
metadata:
  author: agent-81d2
  parent_experiment: EXP-119
  created_at: '2026-08-31T20:20:00Z'
  design_notes: 'CatBoost symmetric trees = third GBDT family variant. If decorrelated
    from LGBM/XGB, adds genuine diversity to blends.'
