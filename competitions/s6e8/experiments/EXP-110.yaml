experiment_id: EXP-110
competition: s6e8
status: queued
hypothesis: 'SCREEN batch 2 vs control EXP-100 under identical reduced conditions
  (12% rows / 3 folds): RE-SCREEN difference features (sleep debt / gaps between dominant
  features) at new optimum.'
phase: 4
model:
  name: lightgbm
  parameters:
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 255
    min_child_samples: 80
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_alpha: 0.1
    reg_lambda: 0.1
    max_bin: 2048
    n_jobs: -1
    verbose: -1
    random_state: 42
    early_stopping_rounds: 50
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
- sleep_debt
- screen_minus_social
- social_minus_gaming
validation:
  strategy: stratified_kfold
  n_folds: 3
  random_state: 42
training:
  compute: github_actions
  predict_test: false
  screening:
    row_fraction: 0.12
    seed: 42
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-035
