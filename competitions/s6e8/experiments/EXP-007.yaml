experiment_id: EXP-007
competition: s6e8
status: queued
hypothesis: LightGBM 5-fold stratified CV with the engineered screen-time feature
  set (9 derived ratios/products/sums + raw behavioral features + 3 categoricals)
  and tuned hyperparameters (num_leaves=63, lr=0.03, up to 1200 trees with early stopping)
  will beat champion EXP-006 (OOF 0.96421).
phase: 4
model:
  name: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 63
    max_depth: -1
    min_child_samples: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    reg_alpha: 0.1
    reg_lambda: 0.1
    n_jobs: -1
    verbose: -1
    random_state: 42
    early_stopping_rounds: 50
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- social_ratio
- gaming_ratio
- weekend_boost
- sleep_debt
- total_leisure
- screen_x_social
- weekend_ratio
- notif_per_hour
- app_per_notif
- gender
- stress_level
- academic_work_impact
feature_engineering:
- op: ratio
  name: social_ratio
  numerator: social_media_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: gaming_ratio
  numerator: gaming_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: weekend_boost
  numerator: weekend_screen_time
  denominator: daily_screen_time_hours
- op: diff
  name: sleep_debt
  terms:
  - sleep_hours
  - daily_screen_time_hours
- op: sum
  name: total_leisure
  terms:
  - social_media_hours
  - gaming_hours
- op: product
  name: screen_x_social
  terms:
  - daily_screen_time_hours
  - social_media_hours
- op: ratio
  name: weekend_ratio
  numerator: weekend_screen_time
  denominator: total_leisure
- op: ratio
  name: notif_per_hour
  numerator: notifications_per_day
  denominator: daily_screen_time_hours
- op: ratio
  name: app_per_notif
  numerator: app_opens_per_day
  denominator: notifications_per_day
validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42
training:
  compute: github_actions
  timeout_minutes: 60
  predict_test: true
