# Experiment Configuration — executed by GitHub Actions (experiment-runner.yml).
# Push a change to this file → Actions trains the model on the committed data
# and writes results back under `results`. DO NOT run this locally.
#
# History: an earlier version of EXP-007 was run LOCALLY on 2026-08-10 and
# recorded OOF 0.96292 vs champion baseline "0.95965" — both numbers conflict
# with the EXP-006 record (OOF 0.96421) and with lgb_cv5_results.json
# (OOF 0.96228). Those local results are void. This config is re-queued for
# an authoritative run on GitHub Actions.

experiment_id: EXP-007
competition: s6e8
status: queued

# Research
hypothesis: >-
  LightGBM 5-fold stratified CV with the engineered screen-time feature set
  (9 derived ratios/products/sums + raw behavioral features + 3 categoricals)
  and tuned hyperparameters (num_leaves=63, lr=0.03, up to 1200 trees with
  early stopping) will beat champion EXP-006 (OOF 0.96421).
phase: 4

# Model configuration
model:
  name: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.03
    num_leaves: 63
    max_depth: -1
    min_child_samples: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    reg_alpha: 0.1
    reg_lambda: 0.1
    n_jobs: -1
    verbose: -1
    random_state: 42
    early_stopping_rounds: 50

# Feature list (engineered features are defined below; runner applies them
# before training). Categoricals are passed to LightGBM as pandas 'category'.
features:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - social_ratio
  - gaming_ratio
  - weekend_boost
  - sleep_debt
  - total_leisure
  - screen_x_social
  - weekend_ratio
  - notif_per_hour
  - app_per_notif
  - gender
  - stress_level
  - academic_work_impact

# Feature engineering (structured ops; see scripts/run_experiment.py)
feature_engineering:
  - op: ratio
    name: social_ratio
    numerator: social_media_hours
    denominator: daily_screen_time_hours
  - op: ratio
    name: gaming_ratio
    numerator: gaming_hours
    denominator: daily_screen_time_hours
  - op: ratio
    name: weekend_boost
    numerator: weekend_screen_time
    denominator: daily_screen_time_hours
  - op: diff
    name: sleep_debt
    terms: [sleep_hours, daily_screen_time_hours]
  - op: sum
    name: total_leisure
    terms: [social_media_hours, gaming_hours]
  - op: product
    name: screen_x_social
    terms: [daily_screen_time_hours, social_media_hours]
  - op: ratio
    name: weekend_ratio
    numerator: weekend_screen_time
    denominator: total_leisure
  - op: ratio
    name: notif_per_hour
    numerator: notifications_per_day
    denominator: daily_screen_time_hours
  - op: ratio
    name: app_per_notif
    numerator: app_opens_per_day
    denominator: notifications_per_day

# Validation
validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42

# Training — MUST be github_actions. Local execution is prohibited.
training:
  compute: github_actions
  timeout_minutes: 60
  predict_test: true

# Metadata
metadata:
  author: agent-3da5
  parent_experiment: EXP-006
  created_at: "2026-08-10T18:25:32Z"
  requeued_at: "2026-08-24T00:00:00Z"
  requeue_reason: >-
    Prior local run produced internally inconsistent scores (0.96292 claimed
    vs 0.95965 cited champion vs 0.96228 in lgb_cv5_results.json); all local
    runs are deprecated in favor of GitHub Actions execution.

# Results (filled automatically by scripts/record_results.py after the run)
