- academic_work_impact
- free_time_slack
feature_engineering:
- op: budget_constraint
  daily: daily_screen_time_hours
  components:
  - social_media_hours
  - gaming_hours
  - work_study_hours
  day_hours: 24.0
- op: impute_median
  columns:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: ratio
  name: productive_ratio
  numerator: work_study_hours
  denominator: daily_screen_time_hours
- op: sum
  name: leisure_hours
  terms:
  - social_media_hours
  - gaming_hours
- op: ratio
  name: leisure_ratio
  numerator: leisure_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: sleep_screen_ratio
  numerator: sleep_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: weekend_binge_ratio
  numerator: weekend_screen_time
  denominator: daily_screen_time_hours
- op: ratio
  name: notif_per_open
  numerator: notifications_per_day
  denominator: app_opens_per_day
- op: sum
  name: accounted_hours
  terms:
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
- op: pair_grid
hypothesis: 'raphdraft 0.96943-LB feature block on top of pair-lattice: median-imputed
  dense view + ratios-from-imputed (productive/leisure/sleep/screen) + 24h composition
  (accounted/unaccounted) + budget-identity-as-constraint features (implied lower
  bound, n_observed/n_missing, slack, slack_per_missing, per-component violation of
  median fill). Their pipeline CV 0.96848 > our best single 0.968041 - this block
  is the main delta we lack. Single variable vs EXP-124: + impute_median/ratio/budget
  FE block.'
