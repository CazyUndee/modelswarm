hypothesis: Lookup-transformer with exact-value embeddings + transformer attention over feature tokens. Each feature value is tokenized as exact string (0.01 grid preserved), embedded, then 4-layer transformer attends over the 13 feature tokens. This architecture treats the quantized numeric structure as discrete vocabulary, complementing tree splits that threshold continuous values. Expected to be decorrelated (rank corr 0.963-0.969 per library) and provide complementary signal for frontier attack.
