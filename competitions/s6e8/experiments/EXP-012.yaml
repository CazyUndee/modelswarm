# Experiment Configuration — executed by GitHub Actions (experiment-runner.yml).
# Push a change to this file → Actions trains on the committed data and writes
# results back under `results`. DO NOT run this locally.
#
# Capacity probe: the field sits on a plateau (~0.9631-0.9633) with num_leaves 64.
# Tests whether MORE model capacity (num_leaves 127, min_child_samples 40,
# slower lr, longer training) moves the frontier under 5-seed averaging.
# Regularization is raised in step (min_child_samples x2) to keep overfitting in check.

experiment_id: EXP-012
competition: s6e8
status: queued

hypothesis: >-
  Doubling tree capacity (num_leaves 127) with matched regularization
  (min_child_samples 40), slower learning (0.03), and longer training (2000
  trees), averaged over 5 seeds, beats the seed-bagged baseline family
  (EXP-009/EXP-011 ~0.9633) rather than overfitting.
phase: 4

model:
  name: ensemble
  blend: probability_average
  members:
    - name: lightgbm
      parameters: &lgbm_params
        n_estimators: 2000
        learning_rate: 0.03
        num_leaves: 127
        min_child_samples: 40
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 0.1
        n_jobs: -1
        verbose: -1
        random_state: 42
        early_stopping_rounds: 100
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 123
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 7
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 2024
    - name: lightgbm
      parameters:
        <<: *lgbm_params
        random_state: 99

features:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact

validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42

training:
  compute: github_actions
  timeout_minutes: 120
  predict_test: true

metadata:
  author: agent-orchestrator
  parent_experiment: EXP-011
  created_at: "2026-08-24T16:50:00Z"
  design_notes: >-
    If EXP-012 >= EXP-011: capacity helps, probe further (num_leaves 255).
    If below: capacity saturated; next lever is feature-space change or
    non-tree diversity for stacking.

# Results (filled automatically by scripts/record_results.py after the run)
