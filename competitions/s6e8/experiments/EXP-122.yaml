hypothesis: 'Fold-count axis (never tested: EXP-041/042 varied fold SEED at n=5, not
  count). n_folds=10 gives each model +12% training rows (622k vs 553k) and halves
  validation variance per fold; every community reference result (TE +0.0030, slack
  +0.0008, TabM singles) was measured at 10-fold, so our 5-fold numbers may understate
  achievable OOF. Single variable vs EXP-120a (m=10 TE): validation.n_folds 5 -> 10.'
