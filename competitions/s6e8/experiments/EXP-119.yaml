feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
hypothesis: '1-D target encoding as input features: exact-value addiction rates are
  wildly non-monotonic yet replicate across independent train halves (community: first
  decimal digit of daily_screen_time swings positive rate 0.6513->0.7365, z=-31.7;
  lookup replicates r=0.9975). Community-measured value: +0.0030 - the single largest
  documented lever this competition (bigger than the +0.0008 slack). Implementation:
  fold-train-fitted smoothed encoding (m=50, NaN kept as explicit group - pandas>=3
  drops them silently otherwise) added as te_<col> columns for the 12 canonical features.
  Single variable vs EXP-118: + TE block only.'
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-118
  created_at: '2026-08-25T18:15:00Z'
  design_notes: 'TE smoothing m=50 is an untested default; if signal confirms, sweep
    m in {10,50,200}. TE columns scoped to 12 canonical features (community-proven
    scope); slack enters raw from EXP-118. Runner change: _target_encode_fit/_apply,
    fold-safe, unit-tested.'
