experiment_id: EXP-016
competition: s6e8
status: queued
hypothesis: 'A probability blend of two nl127 LightGBM seeds (40% weight each) and
  two logistic-regression members (10% each) exploits cross-class error decorrelation
  (corr ~0.92) enough to approach or beat the pure-GBDT champion (EXP-012: 0.964038)
  despite the weaker linear base.'
phase: 4
model:
  name: ensemble
  blend: probability_average
  weights:
    lightgbm: 1.0
    logistic: 0.25
  members:
  - name: lightgbm
    parameters:
      n_estimators: 2000
      learning_rate: 0.03
      num_leaves: 127
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 0.1
      n_jobs: -1
      verbose: -1
      random_state: 42
      early_stopping_rounds: 100
  - name: lightgbm
    parameters:
      n_estimators: 2000
      learning_rate: 0.03
      num_leaves: 127
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 0.1
      n_jobs: -1
      verbose: -1
      random_state: 123
      early_stopping_rounds: 100
  - name: logistic
    parameters:
      C: 0.3
      max_iter: 2000
  - name: logistic
    parameters:
      C: 1.0
      max_iter: 2000
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
validation:
  strategy: stratified_kfold
  n_folds: 5
  random_state: 42
training:
  compute: github_actions
  timeout_minutes: 90
  predict_test: true
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-012
  created_at: '2026-08-24T18:05:00Z'
  design_notes: Weights keyed by member family name (runner resolves 'lightgbm'/'logistic'
    across indexed keys). If blend < pure-GBDT by > 0.0005, linear stacking is dead
    at this quality gap; if within 0.0002, tune weights upward.
