competition: s6e8
experiment_id: EXP-130
features:
- academic_work_impact
- age
- app_opens_per_day
- daily_screen_time_hours
- free_time_slack
- gaming_hours
- gender
- leisure_hours
- leisure_ratio
- notif_per_open
- notifications_per_day
- productive_ratio
- sleep_hours
- sleep_screen_ratio
- social_media_hours
- stress_level
- weekend_binge_ratio
- weekend_screen_time
- work_study_hours
feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
- op: budget_constraint
  daily: daily_screen_time_hours
  components:
  - social_media_hours
  - gaming_hours
  - work_study_hours
  day_hours: 24.0
- op: impute_median
  columns:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
- op: ratio
  name: productive_ratio
  numerator: work_study_hours
  denominator: daily_screen_time_hours
- op: sum
  name: leisure_hours
  terms:
  - social_media_hours
  - gaming_hours
- op: ratio
  name: leisure_ratio
  numerator: leisure_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: sleep_screen_ratio
  numerator: sleep_hours
  denominator: daily_screen_time_hours
- op: ratio
  name: weekend_binge_ratio
  numerator: weekend_screen_time
  denominator: daily_screen_time_hours
- op: ratio
  name: notif_per_open
  numerator: notifications_per_day
  denominator: app_opens_per_day
hypothesis: raphdraft 0.96943-LB feature block ALONE (impute_median -> ratios-from-imputed
  -> budget-constraint views), no pair_grid, no nested TE. EXP-126 collapsed because
  pairs over continuous derived features self-leaked; this isolates whether the block
  itself helps our lineage.
