feature_engineering:
- op: diff
  name: free_time_slack
  terms:
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
hypothesis: 'XGBoost with depth-based trees (max_depth=8, min_child_weight=20)
  instead of LGBM leaf-based (num_leaves=255). XGBoost depth-limiting produces
  genuinely different split candidates from LGBM leaf-counting even on the same
  features. Histogram method + GPU-free CPU-friendly. If OOF decorrelates <0.995
  from champion LGBM, it adds diversity for blend. colsample=0.3 to match champion
  regularization regime.'
metadata:
  author: agent-81d2
  parent_experiment: EXP-119
  created_at: '2026-08-31T20:15:00Z'
  design_notes: 'XGBoost depth-based vs LGBM leaf-based = genuine structural diversity
    within GBDT family. Fast to train (~10 min).'
model:
  name: xgboost
  parameters:
    n_estimators: 3000
    learning_rate: 0.02
    max_depth: 8
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.3
    reg_alpha: 0.1
    reg_lambda: 0.1
    tree_method: hist
    enable_categorical: true
    eval_metric: auc
    early_stopping_rounds: 150
    n_jobs: -1
    random_state: 42
phase: 4
status: queued
training:
  compute: github_actions
  predict_test: true
  timeout_minutes: 60
validation:
  n_folds: 5
  random_state: 42
  strategy: stratified_kfold
target_encoding:
  columns:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  - gender
  - stress_level
  - academic_work_impact
  smoothing: 50
