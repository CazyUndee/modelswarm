hypothesis: XGBoost with depth-based trees (max_depth=8, min_child_weight=20) instead
  of LGBM leaf-based (num_leaves=255). XGBoost depth-limiting produces genuinely different
  split candidates from LGBM leaf-counting even on the same features. Histogram method
  + GPU-free CPU-friendly. If OOF decorrelates <0.995 from champion LGBM, it adds
  diversity for blend. colsample=0.3 to match champion regularization regime.
metadata:
  author: agent-81d2
  parent_experiment: EXP-119
  created_at: '2026-08-31T20:15:00Z'
  design_notes: XGBoost depth-based vs LGBM leaf-based = genuine structural diversity
    within GBDT family. Fast to train (~10 min).
