features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
hypothesis: 'Single-variable A/B vs champion EXP-035 (nl255/max_bin2048/bagged/lr0.02/colsample0.3/mcs80,
  OOF 0.966518) changing only monotone_constraints={''daily_screen_time_hours'': 1,
  ''social_media_hours'': 1, ''gaming_hours'': 1, ''work_study_hours'': 1, ''weekend_screen_time'':
  1}.'
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-035
  created_at: '2026-08-25T08:00:00Z'
  design_notes: 'STRUCTURAL: inject the observed monotone-saturating DGP prior as
    LightGBM monotone_constraints on the 5 provably monotone features (decile analysis:
    all rise monotonically toward p~1). Constraints act as scientific regularization
    - untested structural lever, not tuning.'
