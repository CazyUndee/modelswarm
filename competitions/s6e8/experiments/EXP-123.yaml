hypothesis: 'NESTED target encoding (inner-CV out-of-fold encodings for training rows)
  + level-frequency columns, per the 0.96943-LB public pipeline (raphdraft). Our current
  TE lets each training row''s own label sit inside its own level mean - self-referential
  and mildly optimistic; nested encoding removes that and their 2-model CV (0.96848)
  exceeds our best single (0.968041). Also adds freq_<col> = log1p(level count) as
  a companion feature. Single variable vs EXP-120a: TE block upgraded to nested+freq;
  smoothing stays m=10. Values sit on a 0.01 grid so levels have hundreds of rows
  - inner-fold estimates stay stable.'
metadata:
  author: agent-orchestrator
  parent_experiment: EXP-120a
  created_at: '2026-08-25T21:35:00Z'
  design_notes: Runner gains target_encoding.nested/inner_folds/frequency knobs +
    _nested_target_encode_train (StratifiedKFold inner splits, seed 42) + freq maps
    in stats. Unit-tested for own-label exclusion on lonely levels (test_nested_te.py).
    Budget-bound imputation (missing components bounded by daily-others) deliberately
    NOT included here - one variable at a time; queued as follow-up if nested confirms.
