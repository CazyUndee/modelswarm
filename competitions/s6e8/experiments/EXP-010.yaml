experiment_id: EXP-010
competition: s6e8
status: queued
hypothesis: "Reproducing the EXP-006 legacy configuration exactly (row bagging disabled\
  \ via absent subsample_freq, colsample_bytree 0.8, num_leaves 64, lr 0.05, 1000\
  \ trees, ES 50) yields OOF \u2248 0.96421, confirming the champion baseline; if\
  \ it instead lands near EXP-008's 0.96322, the champion record is unreliable and\
  \ must be re-baselined on GHA evidence."
phase: 3
model:
  name: lightgbm
  parameters:
    n_estimators: 1000
    learning_rate: 0.05
    num_leaves: 64
    reg_alpha: 0.1
    reg_lambda: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
    n_jobs: -1
    verbose: -1
    random_state: 42
features:
- age
- daily_screen_time_hours
- social_media_hours
- gaming_hours
- work_study_hours
- sleep_hours
- notifications_per_day
- app_opens_per_day
- weekend_screen_time
- gender
- stress_level
- academic_work_impact
validation:
