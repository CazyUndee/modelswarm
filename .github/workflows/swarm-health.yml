name: ModelSwarm Health Check

on:
  schedule:
    - cron: "*/15 * * * *"  # Every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e "."

      - name: Check credentials
        id: creds
        run: |
          if [ -n "${{ vars.MODELSWARM_API_URL }}" ] && [ -n "${{ secrets.MODELSWARM_OPS_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::API credentials not set in GitHub Actions. Skipping health check."
          fi

      - name: Run health check
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          python scripts/health_check.py \
            --api-url ${{ vars.MODELSWARM_API_URL }} \
            --ops-agent-id ${{ vars.OPS_AGENT_ID }} \
            --ops-api-key ${{ secrets.MODELSWARM_OPS_KEY }}

      - name: Commit state changes
        run: |
          git config user.name "operations-agent"
          git config user.email "ops@modelswarm.local"
          git add STATE.md experiments/ forum/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated health check update"
          git push
