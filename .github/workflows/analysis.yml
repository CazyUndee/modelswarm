name: On-demand analysis
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path to analysis script inside repo"
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[ml]" kagglehub
      - name: Run analysis
        shell: bash
        run: |
          set -o pipefail
          python "${{ github.event.inputs.script_path }}" 2>&1 | tee analysis_output.txt
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output-${{ github.run_id }}
          path: |
            analysis_output.txt
            *.csv
            **/submission*.csv
          retention-days: 30
