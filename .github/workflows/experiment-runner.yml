name: ModelSwarm Experiment Runner

on:
  push:
    branches: [master]
    paths:
      - 'competitions/**/experiments/*.yaml'
      - 'competitions/**/experiments/*.yml'
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "Experiment ID to run (e.g., EXP-014)"
        required: true
        type: string
      competition_id:
        description: "Competition ID"
        required: true
        type: string
        default: "s6e8"

jobs:
  detect-experiments:
    runs-on: ubuntu-latest
    outputs:
      experiments: ${{ steps.detect.outputs.experiments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect experiments (dispatch or push)
        id: detect
        run: |
          # Manual dispatch: run exactly the requested experiment.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXP_ID="${{ inputs.experiment_id }}"
            COMP_ID="${{ inputs.competition_id }}"
            PATH_GLOB="competitions/${COMP_ID}/experiments/${EXP_ID}.yaml"
            if [ ! -f "$PATH_GLOB" ]; then
              echo "::error::Experiment config not found: $PATH_GLOB"
              exit 1
            fi
            echo "experiments=[{\"id\":\"$EXP_ID\",\"competition\":\"$COMP_ID\",\"path\":\"$PATH_GLOB\"}]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Push: find experiment configs that changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E 'competitions/.*/experiments/.*\.ya?ml$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No experiment changes detected"
            echo "experiments=[]" >> $GITHUB_OUTPUT
          else
            # Build JSON array of experiment IDs
            EXPS="["
            for f in $CHANGED; do
              EXP_ID=$(basename "$f" .yaml)
              EXP_ID=$(basename "$EXP_ID" .yml)
              COMP_ID=$(echo "$f" | cut -d'/' -f2)
              EXPS+="{\"id\":\"$EXP_ID\",\"competition\":\"$COMP_ID\",\"path\":\"$f\"},"
            done
            EXPS="${EXPS%,}]"
            echo "experiments=$EXPS" >> $GITHUB_OUTPUT
          fi

  run-experiment:
    needs: detect-experiments
    if: needs.detect-experiments.outputs.experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      matrix:
        experiment: ${{ fromJson(needs.detect-experiments.outputs.experiments) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[ml]"

      - name: Verify data is present
        run: |
          python competitions/${{ matrix.experiment.competition }}/validate_data.py || {
            echo "::error::Competition data missing or invalid. Data must be committed under competitions/<id>/data/. GitHub Actions cannot download from Kaggle."
            exit 1
          }

      - name: Run experiment
        id: run
        run: |
          python scripts/run_experiment.py \
            --config ${{ matrix.experiment.path }} \
            --output-dir experiments/output/${{ matrix.experiment.id }}/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-${{ matrix.experiment.id }}-artifacts
          path: experiments/output/${{ matrix.experiment.id }}/
          retention-days: 90

      - name: Record results
        if: success()
        run: |
          python scripts/record_results.py \
            --experiment-id ${{ matrix.experiment.id }} \
            --config ${{ matrix.experiment.path }} \
            --output-dir experiments/output/${{ matrix.experiment.id }}/

      - name: Commit results
        if: success()
        run: |
          git config user.name "modelswarm-bot"
          git config user.email "bot@modelswarm.local"
          # Only the experiment YAML (results written back by record_results).
          # Bulky artifacts stay in Actions artifacts + experiments/output (gitignored).
          git add competitions/
          if git diff --staged --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "exp: ${{ matrix.experiment.id }} results [skip ci]"
            # Rebase in case another experiment job pushed meanwhile.
            git pull --rebase origin master && git push
          fi

  sync-results:
    needs: run-experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check API credentials
        id: creds
        run: |
          if [ -n "${{ vars.MODELSWARM_API_URL }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::MODELSWARM_API_URL not set — skipping live-state API sync (results already committed to git)."
          fi

      - name: Update API with results
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          python scripts/sync_results_to_api.py
        env:
          MODELSWARM_API_URL: ${{ vars.MODELSWARM_API_URL }}
          MODELSWARM_API_KEY: ${{ secrets.MODELSWARM_API_KEY }}
