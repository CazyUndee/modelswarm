name: ModelSwarm Experiment Runner

on:
  push:
    branches: [master]
    paths:
      - 'competitions/**/experiments/*.yaml'
      - 'competitions/**/experiments/*.yml'
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "Experiment ID to run (e.g., EXP-014)"
        required: true
        type: string
      competition_id:
        description: "Competition ID"
        required: true
        type: string
        default: "s6e8"

jobs:
  detect-experiments:
    runs-on: ubuntu-latest
    outputs:
      experiments: ${{ steps.detect.outputs.experiments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed experiments
        id: detect
        run: |
          # Find experiment configs that changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E 'competitions/.*/experiments/.*\.ya?ml$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No experiment changes detected"
            echo "experiments=[]" >> $GITHUB_OUTPUT
          else
            # Build JSON array of experiment IDs
            EXPS="["
            for f in $CHANGED; do
              EXP_ID=$(basename "$f" .yaml)
              EXP_ID=$(basename "$EXP_ID" .yml)
              COMP_ID=$(echo "$f" | cut -d'/' -f2)
              EXPS+="{\"id\":\"$EXP_ID\",\"competition\":\"$COMP_ID\",\"path\":\"$f\"},"
            done
            EXPS="${EXPS%,}]"
            echo "experiments=$EXPS" >> $GITHUB_OUTPUT
          fi

  run-experiment:
    needs: detect-experiments
    if: needs.detect-experiments.outputs.experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        experiment: ${{ fromJson(needs.detect-experiments.outputs.experiments) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install -r requirements-ml.txt

      - name: Read experiment config
        id: config
        run: |
          python -c "
          import yaml
          import json
          with open('${{ matrix.experiment.path }}') as f:
              config = yaml.safe_load(f)
          # Output key fields
          print(f'hypothesis={config.get(\"hypothesis\", \"\")}')
          print(f'model={config.get(\"model\", \"lightgbm\")}')
          print(f'features={json.dumps(config.get(\"features\", []))}')
          echo 'config_json<<EOF'
          echo '${{ toJson(config) }}'
          echo 'EOF'
          "

      - name: Run experiment
        id: run
        run: |
          python scripts/run_experiment.py \
            --config ${{ matrix.experiment.path }} \
            --output-dir experiments/output/${{ matrix.experiment.id }}/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-${{ matrix.experiment.id }}-artifacts
          path: experiments/output/${{ matrix.experiment.id }}/
          retention-days: 90

      - name: Record results
        if: success()
        run: |
          python scripts/record_results.py \
            --experiment-id ${{ matrix.experiment.id }} \
            --config ${{ matrix.experiment.path }} \
            --output-dir experiments/output/${{ matrix.experiment.id }}/

      - name: Commit results
        if: success()
        run: |
          git config user.name "modelswarm-bot"
          git config user.email "bot@modelswarm.local"
          git add competitions/ experiments/output/
          git diff --quiet && git diff --staged --quiet || git commit -m "exp: ${{ matrix.experiment.id }} results [skip ci]"
          git push

  sync-results:
    needs: run-experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update API with results
        run: |
          python scripts/sync_results_to_api.py
        env:
          MODELSWARM_API_URL: ${{ vars.MODELSWARM_API_URL }}
          MODELSWARM_API_KEY: ${{ secrets.MODELSWARM_API_KEY }}
